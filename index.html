<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Core mobile viewport: viewport-fit=cover lets us use safe-area insets
         (notch / home-indicator padding) and disables the pinch-zoom you don't
         want in an app-like UI. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />

    <!-- Standalone PWA / "installed app" meta -->
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Utang CP" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="icon" type="image/png" href="/favicon.ico" />
    <title>Credit Management</title>
  </head>

    <script type="module" src="/src/main.jsx"></script>

</html>
